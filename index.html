<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#223d30">
<title>像素农场 · 胡萝卜小田</title>
<meta name="description" content="在六块小田里播种、浇水、收获。装满一篮胡萝卜，就完成了今天的农活。">
<style>
  :root {
    color-scheme: light;
    --ink: #223d30;
    --paper: #fff9e8;
    --cream: #f3ecd4;
    --line: #dfd9be;
    --muted: #556552;
    --orange: #a4401a;
    font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--ink);
  }
  * { box-sizing: border-box; }
  body {
    min-height: 100vh; min-height: 100svh; margin: 0; padding: clamp(12px, 4vw, 48px);
    display: grid; place-items: center;
    background: radial-gradient(#b8c6a2 1px, transparent 1px) 0 0 / 16px 16px, #e1e8cf;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 3px solid #1769b3; outline-offset: 4px; }
  .sprites { position: absolute; width: 0; height: 0; overflow: hidden; }
  .icon { display: block; width: 24px; height: 24px; flex: none; shape-rendering: crispEdges; }
  .game {
    width: min(100%, 990px); background: var(--paper); border: 2px solid var(--ink);
    border-radius: 20px; overflow: hidden; box-shadow: 0 7px 0 #a6b592, 0 17px 42px #263d2919;
  }
  .masthead {
    min-height: 60px; padding: 10px 22px; background: var(--ink); color: #faffdf;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .brand { display: flex; align-items: center; gap: 11px; font: 800 .92rem ui-monospace, monospace; letter-spacing: .12em; }
  .brand .icon { width: 28px; height: 28px; }
  .season { display: inline-flex; align-items: center; gap: 7px; background: #385344; padding: 5px 10px; border-radius: 6px; font-size: .875rem; }
  .season .icon { height: 16px; width: 16px; }
  .game-body { display: grid; grid-template-columns: minmax(250px, 1fr) minmax(0, 2.15fr); }
  .notebook { padding: clamp(22px, 3vw, 34px); display: flex; flex-direction: column; align-items: stretch; }
  .eyebrow { margin: 0 0 8px; color: var(--orange); font: 800 .75rem ui-monospace, monospace; letter-spacing: .15em; }
  h1 { margin: 0; font-size: clamp(2rem, 4.3vw, 3.5rem); line-height: 1.12; letter-spacing: -.055em; font-weight: 900; }
  .intro { margin: 12px 0 23px; color: var(--muted); line-height: 1.55; }
  .basket {
    padding: 13px; display: grid; grid-template-columns: auto 1fr auto; gap: 8px;
    align-items: center; border: 1px solid var(--line); border-radius: 10px; background: var(--cream);
  }
  .basket .icon { width: 28px; height: 28px; }
  .basket-label { font-size: .875rem; font-weight: 750; }
  .score { white-space: nowrap; font: 800 1rem ui-monospace, monospace; }
  .score span { color: var(--muted); font-weight: 600; font-size: .85rem; }
  .meter { grid-column: 1 / -1; display: block; width: 100%; height: 8px; appearance: none; border: 0; border-radius: 3px; background: #ded6b6; overflow: hidden; }
  .meter::-webkit-progress-bar { background: #ded6b6; }
  .meter::-webkit-progress-value { background: #3c7843; }
  .meter::-moz-progress-bar { background: #3c7843; }
  .manual { list-style: none; padding: 0; margin: 23px 0; display: grid; gap: 12px; }
  .manual li { display: flex; align-items: center; gap: 10px; font-size: .875rem; }
  .manual .icon { background: var(--cream); border-radius: 6px; padding: 5px; width: 31px; height: 31px; }
  .manual b { margin-right: 6px; }
  .manual span { color: var(--muted); }
  .restart {
    align-self: flex-start; margin-top: auto; padding: 9px 12px; min-height: 42px;
    border: 1px solid #b6bda0; border-radius: 7px; background: transparent; font-size: .875rem; font-weight: 700;
  }
  .restart:hover { background: #e8edce; }
  .game[data-won] .restart { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .farm { min-width: 0; background: #dfe8bc; border-left: 1px solid #bdc996; }
  .landscape { display: block; width: 100%; height: clamp(145px, 18vw, 204px); background: #b9e0dc; shape-rendering: crispEdges; }
  .field { padding: 17px clamp(13px, 3.2vw, 28px) 21px; }
  .field-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 11px; }
  h2 { margin: 0; font-size: 1.125rem; }
  .field-header span { color: #495c3e; font-size: .875rem; }
  .plots { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .plot {
    display: grid; justify-items: center; align-content: center; gap: 3px;
    border: 2px solid #683f2d; border-radius: 9px; padding: 6px 2px 10px; min-height: 110px; position: relative;
    background: #81523b; box-shadow: 0 3px 0 #6b422c, inset 0 0 0 3px #986448;
    color: #fff5d9; transition: background-color .15s, transform .15s;
  }
  .plot:not(:disabled, [aria-disabled="true"]):hover { background: #966446; transform: translateY(-2px); }
  .plot:not(:disabled, [aria-disabled="true"]):active { transform: translateY(2px); }
  .plot .icon { width: 48px; height: 48px; }
  .action { font-size: .875rem; font-weight: 750; line-height: 1.25; white-space: nowrap; }
  .plot[data-stage="growing"] { background: #64483e; box-shadow: 0 3px 0 #6b422c, inset 0 0 0 3px #83634c; }
  .plot[data-stage="mature"] { border-color: #634223; background: #9b6339; box-shadow: 0 3px 0 #6b422c, inset 0 0 0 3px #edbe69; }
  .plot:disabled { cursor: default; }
  .plot[aria-disabled="true"] { cursor: wait; }
  .growth-track { width: 60%; height: 3px; position: absolute; bottom: 5px; overflow: hidden; background: #4a342c; border-radius: 2px; }
  .growth-track::after { content: ""; display: block; width: 100%; height: 100%; background: #a9e089; transform-origin: left; animation: fill var(--grow-time) linear both; }
  @keyframes fill { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  .notice { display: flex; align-items: center; gap: 8px; min-height: 42px; margin: 15px 0 0; border-radius: 7px; padding: 8px 10px; background: #eef2d4; font-size: .875rem; line-height: 1.4; }
  .notice .icon { width: 19px; height: 19px; }
  .game[data-won] .notice { background: #fff1b6; color: #513a19; font-weight: 750; }
  @media (max-width: 680px) {
    body { align-items: start; }
    .game-body { grid-template-columns: 1fr; }
    .notebook { position: relative; padding: 19px 16px 14px; }
    .eyebrow { margin-bottom: 6px; }
    h1 { font-size: 2.25rem; }
    .intro { margin: 8px 0 14px; }
    .manual { display: none; }
    .restart { position: absolute; top: 17px; right: 16px; min-height: 36px; padding: 6px 8px; font-size: .875rem; }
    .farm { border-left: 0; border-top: 1px solid #bdc996; }
    .masthead { min-height: 48px; padding: 8px 14px; }
    .landscape { height: clamp(105px, 30vw, 164px); }
    .field { padding-top: 12px; }
    .plots { gap: 8px; }
    .plot { min-height: 93px; }
    .plot .icon { width: 42px; height: 42px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .plot { transition: none; }
    .plot:not(:disabled, [aria-disabled="true"]):hover, .plot:not(:disabled, [aria-disabled="true"]):active { transform: none; }
    .growth-track { display: none; }
  }
</style>
</head>

  </header>

  <div class="game-body">
    <aside class="notebook">
      <p class="eyebrow">THE CARROT PATCH</p>
      <h1>像素农场</h1>

        <div class="score"><strong id="count">0</strong> <span>/ <span id="goal">6</span></span></div>
        <progress id="meter" class="meter" value="0" max="6" aria-labelledby="basket-label"></progress>

      <ol class="manual" aria-label="玩法">

        <li><svg class="icon" aria-hidden="true"><use href="#carrot"/></svg><div><b>收获</b><span>长大后点采收</span></div></li>

      <button class="restart" id="restart" type="button">重新开始</button>

</main>
<script>
  const GOAL = 6;
  const GROW_MS = 3000;
  const stages = {
    empty:   { label: '播种', sprite: 'dirt' },
    planted: { label: '浇水', sprite: 'planted' },
    growing: { label: '生长中', sprite: 'sprout' },
    mature:  { label: '收获', sprite: 'carrot' }
  };
  const game = document.querySelector('.game');
  const board = document.querySelector('#plots');
  const restart = document.querySelector('#restart');
  const statusMessage = document.querySelector('#status');
  const noticeIcon = document.querySelector('#notice-icon');
  const count = document.querySelector('#count');
  const meter = document.querySelector('#meter');
  let harvested = 0;

  document.querySelector('#goal').textContent = GOAL;
  meter.max = GOAL;
  board.style.setProperty('--grow-time', GROW_MS + 'ms');

  const plots = Array.from({ length: 6 }, (_, index) => {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'plot';
    const plot = { button, number: index + 1, stage: 'empty', timer: null };
    button.addEventListener('click', () => tend(plot));
    board.append(button);
    return plot;
  });

  function renderPlot(plot) {
    const { label, sprite } = stages[plot.stage];
    const growing = plot.stage === 'growing';
    plot.button.dataset.stage = plot.stage;
    plot.button.setAttribute('aria-label', plot.number + '号菜地：' + label);
    plot.button.setAttribute('aria-disabled', String(growing));
    plot.button.innerHTML = '<svg class="icon" aria-hidden="true"><use href="#' + sprite +
      '"/></svg><span class="action">' + label + '</span>' +
      (growing ? '<span class="growth-track" aria-hidden="true"></span>' : '');
  }

  function announce(message, icon) {
    noticeIcon.setAttribute('href', '#' + icon);
    statusMessage.textContent = message;
  }

  function tend(plot) {
    if (harvested === GOAL || plot.stage === 'growing') return;

    if (plot.stage === 'empty') {
      plot.stage = 'planted';
      announce(plot.number + '号菜地已播种，再点一次就能浇水。', 'seed');
    } else if (plot.stage === 'planted') {
      plot.stage = 'growing';
      announce(plot.number + '号菜地已浇水，' + GROW_MS / 1000 + ' 秒后成熟。', 'drop');
      plot.timer = setTimeout(() => {
        plot.timer = null;
        if (harvested === GOAL) return;
        plot.stage = 'mature';
        renderPlot(plot);
        announce(plot.number + '号菜地成熟了，点一下收获。', 'carrot');
      }, GROW_MS);
    } else {
      plot.stage = 'empty';
      count.textContent = meter.value = ++harvested;
      if (harvested === GOAL) {
        game.dataset.won = '';
        for (const crop of plots) {
          clearTimeout(crop.timer);
          crop.timer = null;
          crop.button.disabled = true;
        }
        restart.textContent = '再玩一局';
        restart.focus();
        announce('丰收啦！今天的胡萝卜装满一篮了。', 'basket');
      } else {
        announce('收获一根！还差 ' + (GOAL - harvested) + ' 根装满篮子。', 'carrot');
      }
    }
    renderPlot(plot);
  }

  function reset() {
    harvested = 0;
    count.textContent = meter.value = 0;
    delete game.dataset.won;
    restart.textContent = '重新开始';
    for (const plot of plots) {
      clearTimeout(plot.timer);
      plot.timer = null;
      plot.stage = 'empty';
      plot.button.disabled = false;
      renderPlot(plot);
    }
    announce('点一块空地，播下第一颗种子。', 'seed');
  }

  restart.addEventListener('click', () => {
    reset();
    plots[0].button.focus();
  });
  reset();
</script>
</body>
</html>
